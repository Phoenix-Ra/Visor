forge_version = "48.1.0"
forge_version_range = "[48,)"
neoforge_version = "20.2.93"
neoforge_version_range = "[20.2,)"
sodium_version = "mc1.20.2-0.5.5"
iris_version = "1.7.1+1.20.1"

["1.20.4"]
# 1.20.3 - 1.20.4
java_version = 17
pack_format = 22
